<style>
:root{--bg:#0b0e13;--panel:#151a22;--line:#343c48;--text:#eef2f7;--muted:#9aa5b4;--accent:#246e9f;--gold:#e8c66a;--danger:#a43d3d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}button,input,textarea{font:inherit;color:inherit}
.topbar{position:sticky;top:0;z-index:50;min-height:50px;background:#11151c;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px}.brand{font-weight:900;letter-spacing:.08em}.navs{display:flex;gap:7px;flex-wrap:wrap}.nav{background:#242b35;border:1px solid #46505e;border-radius:6px;padding:7px 11px;text-decoration:none;color:#fff;font-size:12px;font-weight:800}.nav.primary{background:var(--accent);border-color:#5aade0}
.wrap{max-width:1500px;margin:0 auto;padding:14px}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{border:1px solid #46505e;background:#1d2530;padding:9px 15px;border-radius:8px;cursor:pointer;font-weight:800}.tab.active{background:var(--accent);border-color:#5aade0}.view{display:none}.view.active{display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar input{flex:1;min-width:210px;background:#0d1218;border:1px solid #46505e;border-radius:7px;padding:9px}.btn{background:#242b35;border:1px solid #46505e;border-radius:7px;padding:8px 11px;cursor:pointer;font-weight:700}.btn:hover{background:#303a47}.btn.primary{background:var(--accent);border-color:#5aade0}.btn.danger{background:#702a2a;border-color:#c65b5b}.status{font-size:12px;color:#9fd3f4;min-height:18px}.status.error{color:#ff8a80}
.library-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}.post{background:#10151c;border:1px solid #2e3845;border-radius:11px;padding:13px;display:flex;flex-direction:column;gap:9px}.post-head{display:flex;justify-content:space-between;gap:10px}.post-title{font-size:17px;font-weight:900;overflow-wrap:anywhere}.post-author{font-size:11px;color:var(--gold)}.post-date{font-size:10px;color:var(--muted)}.post-comment{font-size:12px;line-height:1.6;white-space:pre-wrap;min-height:40px}.post-summary{font-size:11px;color:#bdc7d4;display:flex;gap:8px;flex-wrap:wrap}.code{background:#080b10;border:1px solid #303946;border-radius:7px;padding:8px;font:10px ui-monospace,SFMono-Regular,Consolas,monospace;word-break:break-all;max-height:70px;overflow:auto}.post-actions{display:flex;gap:6px;flex-wrap:wrap}.empty{padding:40px;text-align:center;color:var(--muted)}
.builder{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px}.pool,.deck{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}.section-title{font-size:13px;color:#b9c2ce;font-weight:900;letter-spacing:.06em;margin-bottom:9px}.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:9px;max-height:calc(100vh - 185px);overflow:auto;padding:3px}.card{position:relative;height:140px;border-radius:8px;border:1px solid #66717f;padding:6px;cursor:pointer;user-select:none;display:flex;flex-direction:column;justify-content:space-between}.card.color-red{background:linear-gradient(145deg,#b93a32,#4a1111);border-color:#ff766d}.card.color-blue{background:linear-gradient(145deg,#2f79b5,#102b46);border-color:#78c7ff}.card.color-green{background:linear-gradient(145deg,#33804e,#11351e);border-color:#78e39a}.card.color-yellow{background:linear-gradient(145deg,#b08e25,#4a3b0b);border-color:#ffe275}.card.color-black{background:linear-gradient(145deg,#4b4055,#141017);border-color:#d0adff}.card .name{font-size:10px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:18px}.card .meta{font-size:8px;color:#d0d7df}.card .cost{position:absolute;left:4px;top:4px;z-index:1;background:#2b80b9;border-radius:50%;min-width:17px;text-align:center;font-size:9px;font-weight:900;padding:1px}.card:has(.cost) .name{padding-left:23px;padding-right:0}.card .art{height:42px;border-radius:4px;background:#0004;display:flex;align-items:center;justify-content:center;font-size:18px}.card .power,.card .sp{position:absolute;bottom:5px;font-size:14px;font-weight:900;-webkit-text-stroke:1px #000;paint-order:stroke fill;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000}.card .power{left:6px}.card .sp{right:6px}.card .count{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);background:var(--gold);color:#000;font-size:9px;font-weight:900;padding:1px 5px;border-radius:4px}
.form{display:flex;flex-direction:column;gap:8px}.form input,.form textarea{width:100%;background:#0b0e13;border:1px solid #46505e;border-radius:7px;padding:8px}.form textarea{min-height:92px;resize:vertical}.counter{font-size:11px;color:var(--muted)}.deck-list{display:flex;flex-direction:column;gap:5px;max-height:320px;overflow:auto;margin:4px 0 8px}.deck-item{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#10151c;border:1px solid #2a323d;border-radius:6px;padding:6px 8px;font-size:11px}.deck-item .left{display:flex;gap:7px;min-width:0}.deck-item .left span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qty{color:var(--gold);font-weight:900}.mini{width:25px;height:25px;padding:0}.import-row{display:flex;gap:6px}.import-row textarea{min-height:55px}.hint{font-size:10px;color:var(--muted);line-height:1.5}.firebase-state{font-size:10px;color:var(--muted)}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:100;padding:18px}.modal.open{display:flex}.detail{width:min(520px,94vw);background:#171d26;border:1px solid #596575;border-radius:14px;overflow:hidden}.detail-head{padding:14px 16px;border-bottom:1px solid #343c48;display:flex;justify-content:space-between}.detail-body{padding:16px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chip{background:#10151c;border:1px solid #3b4655;border-radius:99px;padding:4px 8px;font-size:10px}.effect{background:#10151c;border:1px solid #303946;border-radius:8px;padding:11px;line-height:1.6;font-size:12px;white-space:pre-wrap}.stats{font-size:22px;font-weight:900;margin:8px 0}.detail-add{width:100%;margin-top:10px}
#detailModal{z-index:120}#deckViewModal{z-index:110}.deck-view{width:min(780px,96vw);max-height:90vh;background:#171d26;border:1px solid #596575;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}.deck-view-body{padding:14px 16px;overflow:auto}.deck-view-meta{font-size:11px;color:var(--muted);margin-top:3px}.deck-view-comment{background:#10151c;border:1px solid #303946;border-radius:8px;padding:10px 12px;margin:10px 0 14px;font-size:12px;line-height:1.6;white-space:pre-wrap}.deck-section{margin-top:13px}.deck-section-title{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #343c48;padding:0 2px 6px;margin-bottom:6px;font-size:12px;font-weight:900;color:#cbd4df}.deck-view-list{display:flex;flex-direction:column;gap:5px}.deck-card-row{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:9px;align-items:center;background:#10151c;border:1px solid #2d3743;border-radius:7px;padding:7px 9px;cursor:pointer}.deck-card-row:hover{background:#18202a}.deck-card-qty{font-weight:900;color:var(--gold);font-size:12px}.deck-card-main{min-width:0}.deck-card-name{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.deck-card-sub{font-size:9px;color:var(--muted);margin-top:2px}.deck-card-stats{font-size:10px;text-align:right;color:#d6dde7;white-space:nowrap}.deck-view-hint{font-size:10px;color:var(--muted);margin-top:9px}
@media(max-width:850px){.builder{grid-template-columns:1fr}.card-grid{max-height:none}.topbar{align-items:flex-start;flex-direction:column}.navs{width:100%}.nav{flex:1;text-align:center}.wrap{padding:9px}.library-grid{grid-template-columns:1fr}.post-actions .btn{flex:1}.pool,.deck{padding:9px}.deck-view{width:98vw;max-height:92vh}.deck-card-row{grid-template-columns:36px minmax(0,1fr);}.deck-card-stats{grid-column:2;text-align:left}}
</style>

<body>
<header class="topbar"><div class="brand">SUMMONER — DECK LIBRARY</div><div class="navs"><a class="nav" href="index.html">タイトル</a><a class="nav" href="deckbuilder.html">デッキ構築</a><a class="nav primary" href="summoner.html">対戦</a></div></header>
<div class="wrap">
  <div class="tabs"><button id="browseTab" class="tab active">みんなのデッキ</button><button id="postTab" class="tab">デッキを投稿する</button></div>
  <section id="browseView" class="view active panel">
    <div class="toolbar"><input id="searchInput" placeholder="デッキ名・投稿者名・コメントを検索"><button id="reloadBtn" class="btn">再読み込み</button></div>
    <div id="browseStatus" class="status"></div>
    <div id="libraryGrid" class="library-grid"></div>
  </section>
  <section id="postView" class="view">
    <div class="builder">
      <div class="pool"><div class="section-title">カードプール — クリックで詳細</div><div id="cardPool" class="card-grid"></div></div>
      <div class="deck">
        <div class="section-title">投稿デッキ <span class="counter"><span id="deckTotal">0 / 50枚</span> ・ 召喚士 <span id="deckSummonerTotal">0 / 1枚</span></span></div>
        <div class="form">
          <input id="deckName" maxlength="40" placeholder="デッキ名（40文字まで）">
          <input id="authorName" maxlength="30" placeholder="投稿者名（30文字まで）">
          <textarea id="comment" maxlength="500" placeholder="デッキのコンセプト、使い方、採用理由など（500文字まで）"></textarea>
          <div class="hint">通常カード50枚＋召喚士1種類1枚を採用してください。召喚士はデッキ枚数に含まれません。アナログ対戦では準備時に裏向き、開始時に公開します。既存のデッキコードも読み込めます。</div>
          <div class="import-row"><textarea id="importCode" placeholder="SMN2-..."></textarea><button id="importBtn" class="btn">読込</button></div>
        </div>
        <div id="deckList" class="deck-list"></div>
        <div id="postStatus" class="status"></div>
        <button id="submitBtn" class="btn primary" style="width:100%;padding:11px">このデッキをDECK LIBRARYに投稿</button>
        <div id="firebaseState" class="firebase-state"></div>
      </div>
    </div>
  </section>
</div>
<div id="detailModal" class="modal"><div class="detail"><div class="detail-head"><strong id="detailName"></strong><button id="detailClose" class="btn">閉じる</button></div><div class="detail-body"><div id="detailChips" class="chips"></div><div id="detailStats" class="stats"></div><div id="detailEffect" class="effect"></div><button id="detailAdd" class="btn primary detail-add">＋ デッキに追加</button></div></div></div>
<div id="deckViewModal" class="modal"><div class="deck-view"><div class="detail-head"><div><strong id="deckViewTitle">デッキ内容</strong><div id="deckViewMeta" class="deck-view-meta"></div></div><button id="deckViewClose" class="btn">閉じる</button></div><div class="deck-view-body"><div id="deckViewSummary" class="post-summary"></div><div id="deckViewComment" class="deck-view-comment"></div><div id="deckViewList"></div><div class="deck-view-hint">カードをクリックすると効果・ステータスを確認できます。</div></div></div></div>
<script src="cards.js"></script>
<script type="module">
import { firebaseAuth, firebaseDb, ensureAnonymousAuth } from "./firebase-config.js";
import { collection, addDoc, getDocs, query, orderBy, limit, serverTimestamp, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

const DB = window.SUMMONER_DB || {};
const DECK_MAX=50, PREFIX="SMN2-", VERSION=3, IMPORT_KEY="summoner_deck_library_import";
let currentDeck={}, detailName=null, posts=[];
const $=id=>document.getElementById(id);
function total(deck=currentDeck){return Object.entries(deck).reduce((sum,[name,cnt])=>sum+(DB[name]?.t!=="summoner"?(Number(cnt)||0):0),0)}
function summonerTotal(deck=currentDeck){return Object.entries(deck).reduce((sum,[name,cnt])=>sum+(DB[name]?.t==="summoner"?(Number(cnt)||0):0),0)}
function icon(c){if(c?.timing==="instant")return "⚡";return c?.t==="monster"?"△":c?.t==="spell"?"✦":c?.t==="summoner"?"◎":c?.t==="land"?"≋":"?"}
function colorIcon(c){return ({red:"🔴",blue:"🔵",green:"🟢",yellow:"🟡",black:"🟣",colorless:"⚪",none:"⚪"})[c?.color]||"⚪"}
function typeJP(t){return t==="monster"?"モンスター":t==="spell"?"魔法":t==="summoner"?"召喚士":t==="land"?"流脈":t}
function colorJP(c){return ({red:"赤",blue:"青",green:"緑",yellow:"黄",black:"黒",colorless:"無色",none:"無色"})[c]||c||"無色"}
function cardNo(c){const m=String(c?.code||"").match(/^BS01-(\d{3})$/);return m?Number(m[1]):null}
function nameByNo(n){return Object.keys(DB).find(x=>cardNo(DB[x])===n)||null}
function checksum(bytes){let s=0x5a;for(const b of bytes)s=((s*33)^b)&255;return s}
function b64url(bytes){let s="";for(const b of bytes)s+=String.fromCharCode(b);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/g,"")}
function from64(text){if(!/^[A-Za-z0-9_-]+$/.test(text))throw Error("デッキコードの文字が不正です。");const p=text.replace(/-/g,"+").replace(/_/g,"/")+"=".repeat((4-text.length%4)%4);return Array.from(atob(p),x=>x.charCodeAt(0))}
function validate(deck,complete=false){if(total(deck)>DECK_MAX)return `通常デッキは${DECK_MAX}枚までです。`;if(summonerTotal(deck)>1)return "召喚士は1種類1枚だけ採用可能です。";for(const [n,c] of Object.entries(deck)){if(!DB[n]||!Number.isInteger(c)||c<1||c>(DB[n]?.t==="summoner"?1:(DB[n]?.n||4)))return `《${n}》の枚数が不正です。`;}if(complete&&total(deck)!==DECK_MAX)return `通常デッキを${DECK_MAX}枚にしてください（現在${total(deck)}枚）。`;if(complete&&summonerTotal(deck)!==1)return "召喚士を専用枠に1種類1枚入れてください。";return ""}
function encode(deck=currentDeck){const e=validate(deck,true);if(e)throw Error(e);const a=[];for(const [n,c] of Object.entries(deck)){if(!c)continue;const no=cardNo(DB[n]);if(!no||no>255)throw Error(`《${n}》をコード化できません。`);a.push([no,c])}a.sort((x,y)=>x[0]-y[0]);const bytes=[VERSION,total(deck),a.length];for(const [n,c] of a)bytes.push(n,c);bytes.push(checksum(bytes));return PREFIX+b64url(bytes)}
function decode(raw){const code=String(raw||"").trim().replace(/\s+/g,"");if(!code.startsWith(PREFIX))throw Error("SUMMONER Beta2のデッキコードではありません。");const bytes=from64(code.slice(PREFIX.length));if(bytes.length<4)throw Error("デッキコードが短すぎます。");const chk=bytes.pop();if(checksum(bytes)!==chk)throw Error("デッキコードが壊れています。");const [v,declared,count]=bytes;if(v!==2&&v!==VERSION)throw Error("未対応のデッキコード形式です。");if(bytes.length!==3+count*2)throw Error("デッキコードの長さが不正です。");const d={};let sum=0;for(let i=0;i<count;i++){const no=bytes[3+i*2],qty=bytes[4+i*2],name=nameByNo(no);if(!name)throw Error(`BS01-${String(no).padStart(3,"0")}は削除済み、または現行カードプールに存在しません。召喚士を選び直したデッキコードが必要です。`);if(qty<1||qty>(DB[name]?.t==="summoner"&&v===3?1:(DB[name]?.n||4)))throw Error(`《${name}》の枚数が不正です。`);d[name]=qty;sum+=qty}if((v===2?sum:total(d))!==declared)throw Error("合計枚数が一致しません。");if(v===3){const e=validate(d,true);if(e)throw Error(e)}return d}
function setStatus(id,msg,err=false){const el=$(id);el.textContent=msg||"";el.classList.toggle("error",!!err)}
function escText(v){return String(v??"")}

function renderPool(){const box=$("cardPool");box.innerHTML="";for(const [name,c] of Object.entries(DB)){const el=document.createElement("div");el.className=`card color-${c.color||"none"}`;el.innerHTML=`<div class="name">${colorIcon(c)} ${escText(name)}</div><div class="meta">${c.code||""} / ${typeJP(c.t)}</div>${c.t!=="summoner"?`<div class="cost">${c.c}</div>`:""}<div class="art">${icon(c)}</div>${c.t==="monster"?`<div class="power">${c.power}</div><div class="sp">${c.sp}</div>`:""}<div class="count">${currentDeck[name]||0}/${c.t==="summoner"?1:(c.n||4)}</div>`;el.onclick=()=>showDetail(name);box.appendChild(el)}}
function showDetail(name,allowAdd=true){detailName=name;const c=DB[name];$("detailName").textContent=`${colorIcon(c)} ${name}`;const chips=[c.code,colorJP(c.color),typeJP(c.t),c.race,c.t!=="summoner"?`コスト ${c.c}`:null,c.timing==="instant"?"高速詠唱":null].filter(Boolean);$("detailChips").innerHTML="";for(const x of chips){const s=document.createElement("span");s.className="chip";s.textContent=x;$("detailChips").appendChild(s)}$("detailStats").textContent=c.t==="monster"?`パワー ${c.power} / SP ${c.sp}`:"";$("detailEffect").textContent=c.txt||"効果なし";$("detailAdd").style.display=allowAdd?"":"none";$("detailModal").classList.add("open")}
function addCard(name){const c=DB[name];if(!c)return;if(c.t==="summoner"){const old=Object.keys(currentDeck).find(n=>DB[n]?.t==="summoner"&&currentDeck[n]);if(old===name)return alert("召喚士は1枚だけです。");if(old&&!confirm(`召喚士を《${old}》から《${name}》に変更しますか？`))return;if(old)delete currentDeck[old];currentDeck[name]=1;renderBuilder();return;}if(total()>=DECK_MAX)return alert(`通常デッキは${DECK_MAX}枚までです。`);if((currentDeck[name]||0)>=(c.n||4))return alert(`《${name}》は最大${c.n||4}枚です。`);currentDeck[name]=(currentDeck[name]||0)+1;renderBuilder()}
function removeCard(name){if(currentDeck[name]){currentDeck[name]--;if(currentDeck[name]<=0)delete currentDeck[name];renderBuilder()}}
function renderBuilder(){$("deckTotal").textContent=`${total()} / ${DECK_MAX}枚`;$("deckSummonerTotal").textContent=`${summonerTotal()} / 1枚`;const box=$("deckList");box.innerHTML="";const order=Object.keys(DB);for(const name of order){const qty=currentDeck[name]||0;if(!qty)continue;const c=DB[name],row=document.createElement("div");row.className="deck-item";const left=document.createElement("div");left.className="left";const q=document.createElement("span");q.className="qty";q.textContent=`${qty}x`;const nm=document.createElement("span");nm.textContent=`${colorIcon(c)} ${icon(c)} ${name}`;left.append(q,nm);const actions=document.createElement("div");const plus=document.createElement("button");plus.className="btn mini";plus.textContent="+";plus.onclick=()=>addCard(name);const minus=document.createElement("button");minus.className="btn mini";minus.textContent="−";minus.onclick=()=>removeCard(name);actions.append(plus,minus);row.append(left,actions);box.appendChild(row)}if(!box.children.length){box.innerHTML='<div class="empty" style="padding:20px">カード詳細の「＋ デッキに追加」から構築してください。</div>'}renderPool()}

async function initAuth(){try{const user=await ensureAnonymousAuth();$("firebaseState").textContent=`Firebase接続済み / 匿名ユーザー ${user.uid.slice(0,8)}…`;return user}catch(e){$("firebaseState").textContent=`Firebase認証エラー: ${e.code||e.message}`;throw e}}
async function loadPosts(){setStatus("browseStatus","デッキを読み込んでいます…");try{const q=query(collection(firebaseDb,"decks"),orderBy("createdAt","desc"),limit(100));const snap=await getDocs(q);posts=snap.docs.map(d=>({id:d.id,...d.data()}));renderPosts();setStatus("browseStatus",`${posts.length}件のデッキを表示しています。`)}catch(e){console.error(e);setStatus("browseStatus",`読み込みに失敗しました: ${e.code||e.message}`,true);$("libraryGrid").innerHTML='<div class="empty">Firestoreのルールまたは接続設定を確認してください。</div>'}}
function deckSummary(code){try{const d=decode(code);const colors={red:0,blue:0,green:0,yellow:0,black:0};let summoners=0;for(const [n,cnt] of Object.entries(d)){const c=DB[n];if(colors[c?.color]!=null)colors[c.color]+=cnt;if(c?.t==="summoner")summoners+=cnt}const parts=[];for(const [c,v] of Object.entries(colors))if(v)parts.push(`${colorIcon({color:c})}${v}`);parts.push(`◎${summoners}/1`);parts.push(`通常${total(d)}/50枚`);return parts.join(" / ")}catch(_){return "デッキコードを読み取れません"}}
function showDeckContents(p){let d;try{d=decode(p.deckCode)}catch(e){return alert(`デッキ内容を読み取れません: ${e.message}`)}$("deckViewTitle").textContent=p.deckName||"無題デッキ";$("deckViewMeta").textContent=`投稿者：${p.authorName||"名無し"} / 通常${total(d)}枚＋召喚士${summonerTotal(d)}枚`;$("deckViewSummary").textContent=deckSummary(p.deckCode);$("deckViewComment").textContent=p.comment||"コメントなし";const root=$("deckViewList");root.innerHTML="";const groups=[["monster","△ モンスター"],["spell","✦ 魔法"],["summoner","◎ 召喚士"],["land","≋ 流脈"]];const order=Object.keys(DB);for(const [type,label] of groups){const names=order.filter(n=>d[n]&&DB[n]?.t===type);if(!names.length)continue;const sec=document.createElement("section");sec.className="deck-section";const head=document.createElement("div");head.className="deck-section-title";const groupTotal=names.reduce((sum,n)=>sum+d[n],0);head.innerHTML=`<span>${label}</span><span>${groupTotal}枚</span>`;const list=document.createElement("div");list.className="deck-view-list";for(const name of names){const c=DB[name],row=document.createElement("div");row.className="deck-card-row";const qty=document.createElement("div");qty.className="deck-card-qty";qty.textContent=`${d[name]}x`;const main=document.createElement("div");main.className="deck-card-main";const nm=document.createElement("div");nm.className="deck-card-name";nm.textContent=`${colorIcon(c)} ${icon(c)} ${name}`;const sub=document.createElement("div");sub.className="deck-card-sub";sub.textContent=[c.code,colorJP(c.color),c.race].filter(Boolean).join(" / ");main.append(nm,sub);const stats=document.createElement("div");stats.className="deck-card-stats";stats.textContent=c.t==="monster"?`COST ${c.c}  パワー ${c.power} / SP ${c.sp}`:c.t==="spell"?`COST ${c.c}`:c.t==="land"?"流脈":"召喚士";row.append(qty,main,stats);row.onclick=()=>showDetail(name,false);list.appendChild(row)}sec.append(head,list);root.appendChild(sec)}$("deckViewModal").classList.add("open")}
function renderPosts(){const needle=$("searchInput").value.trim().toLowerCase();const grid=$("libraryGrid");grid.innerHTML="";const list=posts.filter(p=>!needle||`${p.deckName||""} ${p.authorName||""} ${p.comment||""}`.toLowerCase().includes(needle));for(const p of list){const card=document.createElement("article");card.className="post";const head=document.createElement("div");head.className="post-head";const left=document.createElement("div");const title=document.createElement("div");title.className="post-title";title.textContent=p.deckName||"無題デッキ";const author=document.createElement("div");author.className="post-author";author.textContent=`投稿者：${p.authorName||"名無し"}`;left.append(title,author);const date=document.createElement("div");date.className="post-date";date.textContent=p.createdAt?.toDate?new Intl.DateTimeFormat("ja-JP",{dateStyle:"short",timeStyle:"short"}).format(p.createdAt.toDate()):"投稿直後";head.append(left,date);const summary=document.createElement("div");summary.className="post-summary";summary.textContent=deckSummary(p.deckCode);const comment=document.createElement("div");comment.className="post-comment";comment.textContent=p.comment||"コメントなし";const code=document.createElement("div");code.className="code";code.textContent=p.deckCode||"";const acts=document.createElement("div");acts.className="post-actions";const view=document.createElement("button");view.className="btn";view.textContent="デッキ内容を見る";view.onclick=()=>showDeckContents(p);const copy=document.createElement("button");copy.className="btn";copy.textContent="コードをコピー";copy.onclick=()=>copyCode(p.deckCode,copy);const use=document.createElement("button");use.className="btn primary";use.textContent="このデッキを使う";use.onclick=()=>{localStorage.setItem(IMPORT_KEY,JSON.stringify({code:p.deckCode,name:p.deckName||"ライブラリデッキ"}));location.href="deckbuilder.html"};try{decode(p.deckCode)}catch(_){use.disabled=true;use.textContent="現行ルールでは使用不可";use.title="削除カードなどが含まれています。召喚士を選び直してください。";}acts.append(view,copy,use);if(firebaseAuth.currentUser&&firebaseAuth.currentUser.uid===p.ownerUid){const del=document.createElement("button");del.className="btn danger";del.textContent="自分の投稿を削除";del.onclick=()=>removePost(p);acts.appendChild(del)}card.append(head,summary,comment,code,acts);grid.appendChild(card)}if(!list.length)grid.innerHTML='<div class="empty">該当するデッキはありません。</div>'}
async function copyCode(code,button){try{await navigator.clipboard.writeText(code);const old=button.textContent;button.textContent="コピーしました";setTimeout(()=>button.textContent=old,1200)}catch(_){prompt("このデッキコードをコピーしてください",code)}}
async function removePost(p){if(!confirm(`「${p.deckName}」をDECK LIBRARYから削除しますか？`))return;try{await deleteDoc(doc(firebaseDb,"decks",p.id));await loadPosts()}catch(e){alert(`削除できませんでした: ${e.code||e.message}`)}}
async function submitDeck(){setStatus("postStatus","");const deckName=$("deckName").value.trim(),authorName=$("authorName").value.trim(),comment=$("comment").value.trim();if(!deckName)return setStatus("postStatus","デッキ名を入力してください。",true);if(!authorName)return setStatus("postStatus","投稿者名を入力してください。",true);if(deckName.length>40||authorName.length>30||comment.length>500)return setStatus("postStatus","入力文字数を確認してください。",true);let code;try{code=encode()}catch(e){return setStatus("postStatus",e.message,true)}try{const user=await ensureAnonymousAuth();$("submitBtn").disabled=true;setStatus("postStatus","投稿しています…");await addDoc(collection(firebaseDb,"decks"),{deckName,authorName,comment,deckCode:code,ownerUid:user.uid,createdAt:serverTimestamp()});setStatus("postStatus","投稿しました。みんなのデッキ一覧へ移動します。");await loadPosts();showTab("browse")}catch(e){console.error(e);setStatus("postStatus",`投稿に失敗しました: ${e.code||e.message}`,true)}finally{$("submitBtn").disabled=false}}
function showTab(which){const browse=which==="browse";$("browseView").classList.toggle("active",browse);$("postView").classList.toggle("active",!browse);$("browseTab").classList.toggle("active",browse);$("postTab").classList.toggle("active",!browse)}

$("browseTab").onclick=()=>showTab("browse");$("postTab").onclick=()=>showTab("post");$("reloadBtn").onclick=loadPosts;$("searchInput").oninput=renderPosts;$("detailClose").onclick=()=>$("detailModal").classList.remove("open");$("detailModal").onclick=e=>{if(e.target===$("detailModal"))$("detailModal").classList.remove("open")};$("deckViewClose").onclick=()=>$("deckViewModal").classList.remove("open");$("deckViewModal").onclick=e=>{if(e.target===$("deckViewModal"))$("deckViewModal").classList.remove("open")};$("detailAdd").onclick=()=>{if(detailName)addCard(detailName);$("detailModal").classList.remove("open")};$("importBtn").onclick=()=>{try{currentDeck=decode($("importCode").value);renderBuilder();setStatus("postStatus",`通常${total()}枚＋召喚士${summonerTotal()}枚を読み込みました。`)}catch(e){setStatus("postStatus",e.message,true)}};$("submitBtn").onclick=submitDeck;
$("authorName").value=localStorage.getItem("arcana_duel_current_user")||"";
renderBuilder();
initAuth().catch(()=>{}).finally(loadPosts);
</script>
